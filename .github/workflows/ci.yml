name: UI Playwright E2E Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  # Allow other repos to trigger this workflow
  workflow_dispatch:
    inputs:
      test_grep:
        description: "Playwright --grep filter (e.g. @product-service, @order-service, or empty for all)"
        required: false
        default: ""
      preview_url:
        description: "Preview URL to test against (skips local docker compose if provided)"
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ────────────────────────────────────────────────────────────
  # Fast gate: run AI module unit tests (vitest) before the
  # heavyweight E2E job.  No services or browsers required.
  # ────────────────────────────────────────────────────────────
  ai-unit-tests:
    name: AI Module Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run AI unit tests
        run: npm run test:ai

  # ────────────────────────────────────────────────────────────
  # Single stage: bring the stack up via Docker Compose on the
  # runner, run Playwright against http://localhost, then tear it
  # down. No external preview-env service is required.
  # ────────────────────────────────────────────────────────────
  e2e-tests:
    name: E2E Tests (all)
    needs: ai-unit-tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout micro-frontend
        uses: actions/checkout@v4
        with:
          repository: boschtech/micro-frontend
          path: micro-frontend
          token: ${{ secrets.CROSS_REPO_TOKEN || github.token }}

      - name: Checkout product-service
        uses: actions/checkout@v4
        with:
          repository: boschtech/product-service
          path: product-service
          token: ${{ secrets.CROSS_REPO_TOKEN || github.token }}

      - name: Checkout order-service
        uses: actions/checkout@v4
        with:
          repository: boschtech/order-service
          path: order-service
          token: ${{ secrets.CROSS_REPO_TOKEN || github.token }}

      - name: Checkout ui-playwright-automation (this repo)
        uses: actions/checkout@v4
        with:
          path: ui-playwright-automation

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: |
            product-service/pom.xml
            order-service/pom.xml

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            micro-frontend/package-lock.json
            ui-playwright-automation/package-lock.json

      - name: Build product-service JAR
        working-directory: product-service
        run: mvn package -DskipTests -B

      - name: Build order-service JAR
        working-directory: order-service
        run: mvn package -DskipTests -B

      - name: Install micro-frontend deps
        working-directory: micro-frontend
        run: npm ci

      - name: Build micro-frontend
        working-directory: micro-frontend
        env:
          VITE_PRODUCT_SERVICE_URL: http://localhost:8080
          VITE_ORDER_SERVICE_URL: http://localhost:8081
        run: npm run build

      - name: Start product-service
        working-directory: product-service
        env:
          CORS_ALLOWED_ORIGINS: http://localhost:3000
          ORDER_SERVICE_URL: http://localhost:8081
        run: |
          nohup java -jar target/*.jar > product-service.log 2>&1 &
          echo $! > /tmp/product-service.pid

      - name: Start order-service
        working-directory: order-service
        env:
          CORS_ALLOWED_ORIGINS: http://localhost:3000
          PRODUCT_SERVICE_URL: http://localhost:8080
        run: |
          nohup java -jar target/*.jar > order-service.log 2>&1 &
          echo $! > /tmp/order-service.pid

      - name: Serve micro-frontend
        working-directory: micro-frontend
        run: |
          nohup npx --yes serve -s dist -l 3000 > micro-frontend.log 2>&1 &
          echo $! > /tmp/micro-frontend.pid

      - name: Wait for services to be healthy
        run: |
          wait_for() {
            local url=$1
            echo "Waiting for $url"
            for i in $(seq 1 60); do
              if curl -sf "$url" > /dev/null 2>&1; then
                echo "✅ $url is up"
                return 0
              fi
              sleep 2
            done
            echo "❌ Timed out waiting for $url"
            return 1
          }
          wait_for http://localhost:8080/actuator/health
          wait_for http://localhost:8081/actuator/health
          wait_for http://localhost:3000

      # ── AI: Restore cross-run history and contracts from cache ──
      # Keyed by branch so each branch accumulates its own history.
      # The cache is updated at the end of every successful run via
      # the 'Save AI history/contracts cache' step below.
      - name: Restore AI history/contracts cache
        uses: actions/cache@v4
        with:
          path: |
            ui-playwright-automation/ai/history
            ui-playwright-automation/ai/contracts
          key: ai-data-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            ai-data-${{ github.ref_name }}-
            ai-data-main-

      - name: Install Playwright deps
        working-directory: ui-playwright-automation
        run: npm ci

      - name: Install Playwright browsers
        working-directory: ui-playwright-automation
        run: npx playwright install --with-deps

      # ── AI: Smart regression selection (optional) ──
      - name: AI - Smart Regression Selection
        if: env.ANTHROPIC_API_KEY != ''
        working-directory: ui-playwright-automation
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          GREP_ARGS=$(npx tsx ai/scripts/select-regression.ts --output-args 2>/dev/null || true)
          echo "AI_GREP_ARGS=$GREP_ARGS" >> $GITHUB_ENV
          echo "Regression selection: $GREP_ARGS"

      - name: Run All E2E Tests
        working-directory: ui-playwright-automation
        env:
          E2E_BASE_URL: http://localhost:3000
          CI: true
        run: npx playwright test ${{ env.AI_GREP_ARGS }}

      # ── AI: Post-test analysis pipeline ──
      - name: AI - Failure RCA
        if: failure() && env.ANTHROPIC_API_KEY != ''
        working-directory: ui-playwright-automation
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npx tsx ai/scripts/analyze-failures.ts || true

      - name: AI - Flaky Test Detection
        if: always() && env.ANTHROPIC_API_KEY != ''
        working-directory: ui-playwright-automation
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npx tsx ai/scripts/detect-flaky.ts || true

      - name: AI - Auto-Create Defects
        if: failure() && env.ANTHROPIC_API_KEY != ''
        working-directory: ui-playwright-automation
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx tsx ai/scripts/create-defects.ts || true

      - name: AI - Validate API Contracts
        if: always() && env.ANTHROPIC_API_KEY != ''
        working-directory: ui-playwright-automation
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npx tsx ai/scripts/validate-contracts.ts || true

      # ── AI: Persist api-captures.json separately so it resets each run ──
      # History and contracts accumulate; captures are per-run only.
      - name: Clear API captures for next run
        if: always()
        working-directory: ui-playwright-automation
        run: rm -f ai/history/api-captures.json || true

      - name: Save AI history/contracts cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ui-playwright-automation/ai/history
            ui-playwright-automation/ai/contracts
          key: ai-data-${{ github.ref_name }}-${{ github.run_id }}

      - name: Upload AI Analysis Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-analysis-reports
          path: |
            ui-playwright-automation/ai/history/
            ui-playwright-automation/ai/contracts/
          retention-days: 14
          if-no-files-found: ignore

      # - name: Run Playwright Tests
      #   env:
      #     E2E_BASE_URL: ${{ steps.resolve-url.outputs.url }}
      #     CI: true
      #   run: |
      #     GREP="${{ github.event.inputs.test_grep }}"
      #     if [ -n "$GREP" ]; then
      #       npx playwright test --grep "$GREP"
      #     else
      #       npx playwright test
      #     fi

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: ui-playwright-automation/playwright-report/
          retention-days: 14

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: ui-playwright-automation/test-results/
          retention-days: 14

      - name: Upload Service Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: service-logs
          path: |
            product-service/product-service.log
            order-service/order-service.log
            micro-frontend/micro-frontend.log
          retention-days: 7

      - name: Stop services
        if: always()
        run: |
          for pidfile in /tmp/product-service.pid /tmp/order-service.pid /tmp/micro-frontend.pid; do
            [ -f "$pidfile" ] && kill "$(cat "$pidfile")" 2>/dev/null || true
          done

  # ────────────────────────────────────────────────────────────
  # Publish the Playwright HTML report to the gh-pages branch so
  # it can be viewed at https://<org>.github.io/<repo>/
  # Runs after e2e-tests, even on failure, so failed runs are
  # still browsable. Only publishes from the main branch.
  # ────────────────────────────────────────────────────────────
  publish-report:
    name: Publish Playwright Report to GitHub Pages
    needs: e2e-tests
    if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Playwright Report artifact
        uses: actions/download-artifact@v4
        with:
          name: playwright-report
          path: playwright-report

      - name: Deploy report to gh-pages
        id: deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./playwright-report
          publish_branch: gh-pages
          keep_files: false
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: "docs: update Playwright report for ${{ github.sha }}"
          full_commit_message: |
            docs: update Playwright report

            Run: ${{ github.run_id }}
            Commit: ${{ github.sha }}
            Workflow: ${{ github.workflow }}

      - name: Write Playwright report link to run summary
        if: always()
        env:
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          # Derive the Pages URL. For a project site the canonical URL is:
          #   https://<owner>.github.io/<repo>/
          # Lowercase the owner because GitHub Pages hostnames are case-insensitive
          # but case-sensitive repo paths are served verbatim.
          OWNER_LC=$(echo "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')
          PAGES_URL="https://${OWNER_LC}.github.io/${REPO_NAME}/"

          {
            echo "## 📊 Playwright Report"
            echo ""
            echo "The HTML report for this run has been published to GitHub Pages:"
            echo ""
            echo "🔗 **[View Playwright Report](${PAGES_URL})**"
            echo ""
            echo "- Commit: \`${COMMIT_SHA}\`"
            echo "- Run ID: [\`${RUN_ID}\`](https://github.com/${REPO_OWNER}/${REPO_NAME}/actions/runs/${RUN_ID})"
            echo ""
            echo "> Note: GitHub Pages may take ~30s to propagate after deploy."
          } >> "$GITHUB_STEP_SUMMARY"
